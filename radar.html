<title>Radar Vintage Vinted</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: étiquette de friperie — en-tête compact, filtres collants, grille de fiches produit */
:root {
  --bg: #f1f3ee;
  --surface: #fbfcf9;
  --ink: #18211d;
  --muted: #5d6b63;
  --line: #d6ddd5;
  --accent: #1d5a45;
  --accent-ink: #ffffff;
  --tag: #e7c56a;
  --tag-ink: #2b2208;
  --new: #b4422c;
  --warn-bg: #fbe9d6;
  --warn-ink: #7a3a10;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #19201c; --ink: #e6ebe6; --muted: #98a69d; --line: #2c3631;
    --accent: #79c7a3; --accent-ink: #0d1a14; --tag: #d9b65a; --tag-ink: #241c05; --new: #f08a70;
    --warn-bg: #3a2414; --warn-ink: #f4c49a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #19201c; --ink: #e6ebe6; --muted: #98a69d; --line: #2c3631;
  --accent: #79c7a3; --accent-ink: #0d1a14; --tag: #d9b65a; --tag-ink: #241c05; --new: #f08a70;
  --warn-bg: #3a2414; --warn-ink: #f4c49a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
h1 {
  font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 6vw, 52px); line-height: .95;
  letter-spacing: .01em; text-transform: uppercase; margin: 0; text-wrap: balance;
}
h1 span { color: var(--accent); }
.status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--accent); }
.dot.err { background: var(--new); }
.profile { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.size {
  font-family: var(--f-mono); font-size: 12px; padding: 3px 8px; border: 1px dashed var(--muted);
  border-radius: 3px; color: var(--ink); background: var(--surface);
}
.banner { background: var(--warn-bg); color: var(--warn-ink); padding: 12px 14px; border-radius: 6px; font-size: 14px; }
.banner[hidden] { display: none; }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
  padding-block: 10px; border-bottom: 1px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab {
  font: 600 13px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 6px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.tab .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab[aria-pressed="true"] .n { color: var(--bg); opacity: .75; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select, .btn {
  font: 500 13px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  display: grid; grid-template-rows: auto 1fr; min-width: 0;
}
.pic { position: relative; aspect-ratio: 3 / 4; background: var(--line); max-width: 100%; }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.badge-new {
  position: absolute; top: 8px; left: 8px; background: var(--new); color: #fff; font: 700 11px var(--f-body);
  letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border-radius: 3px;
}
.score {
  position: absolute; top: 8px; right: 8px; background: var(--tag); color: var(--tag-ink);
  font: 500 12px var(--f-mono); padding: 3px 7px; border-radius: 3px;
}
.score::before { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--tag-ink); margin-right: 5px; vertical-align: middle; opacity: .6; }
.body { padding: 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.brand { font: 800 20px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.title { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.price { font: 800 24px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.price small { font: 400 12px var(--f-body); color: var(--muted); margin-left: 6px; }
.avis { font-size: 13px; border-left: 2px solid var(--tag); padding-left: 8px; }
.actions { display: flex; gap: 6px; align-items: center; margin-top: 2px; }
.actions a { flex: 1; text-align: center; text-decoration: none; }
.icon { width: 34px; padding: 6px 0; display: inline-grid; place-items: center; }
.icon svg { width: 16px; height: 16px; }
.icon[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.icon[aria-pressed="true"] svg { fill: currentColor; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 6px; }
.empty strong { color: var(--ink); font: 800 22px var(--f-display); text-transform: uppercase; }
footer { font-size: 12px; color: var(--muted); }
@media (max-width: 480px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .brand { font-size: 17px; } .price { font-size: 20px; } .body { padding: 10px; } }
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .15s ease; } .card:hover { transform: translateY(-2px); } }
</style>

<div class="wrap">
  <header>
    <div style="display:grid;gap:10px">
      <h1>Radar <span>vintage</span></h1>
      <div class="profile">
        <span>Tes tailles</span>
        <span class="size">HAUT L</span><span class="size">JEAN W32–34</span><span class="size">EU 43–44</span>
      </div>
    </div>
    <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">Connexion à la base…</span></div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="bar">
    <div class="tabs" id="tabs" role="group" aria-label="Catégories"></div>
    <div class="tools">
      <label for="sort" style="font-size:13px;color:var(--muted)">Trier</label>
      <select id="sort">
        <option value="found">Plus récentes</option>
        <option value="score">Meilleur score</option>
        <option value="price">Prix croissant</option>
      </select>
      <button class="btn" id="markSeen" type="button">Tout marquer vu</button>
    </div>
  </div>

  <main id="grid" class="grid" aria-live="polite"></main>

  <footer id="foot">Les pièces arrivent toutes les heures. Le score combine la marque, les indices d'époque et de fabrication (made in USA, England…), l'état et le prix. Les sauvegardes et les pièces masquées restent privées.</footer>
</div>

<script>
(function () {
  const CATS = [
    ["all", "Tout"], ["vestes", "Vestes"], ["hauts", "Hauts"], ["bas", "Bas"], ["chaussures", "Chaussures"], ["saved", "Sauvegardées"]
  ];
  const state = { items: [], saved: {}, hidden: {}, lastSeen: null, cat: "all", sort: "found", status: null, uid: null, db: null, loaded: false };
  try { state.cat = localStorage.getItem("radar.cat") || "all"; state.sort = localStorage.getItem("radar.sort") || "found"; } catch (e) {}
  try { state.lastSeen = localStorage.getItem("radar.lastSeen"); } catch (e) {}

  const $ = (id) => document.getElementById(id);
  const fmtPrice = (n) => n == null ? "—" : new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: n % 1 ? 2 : 0 }).format(n);
  function ago(iso) {
    if (!iso) return "";
    const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return "à l'instant";
    if (m < 60) return "il y a " + m + " min";
    const h = Math.round(m / 60);
    if (h < 24) return "il y a " + h + " h";
    return "il y a " + Math.round(h / 24) + " j";
  }
  const isNew = (it) => !state.lastSeen || (it.found_at && it.found_at > state.lastSeen);

  const ICON_STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z" stroke-linejoin="round"/></svg>';
  const ICON_HIDE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>';

  function visible() {
    let list;
    if (state.cat === "saved") {
      const byId = Object.fromEntries(state.items.map((i) => [i.vinted_id, i]));
      list = Object.values(state.saved).map((s) => byId[s.vinted_id] || s);
    } else {
      list = state.items.filter((i) => !state.hidden[i.vinted_id] && (state.cat === "all" || i.category === state.cat));
    }
    const s = state.sort;
    list = list.slice().sort((a, b) =>
      s === "score" ? (b.score || 0) - (a.score || 0)
      : s === "price" ? (a.price ?? 1e9) - (b.price ?? 1e9)
      : String(b.found_at || "").localeCompare(String(a.found_at || "")));
    return list;
  }

  function renderTabs() {
    const counts = { all: 0, saved: Object.keys(state.saved).length };
    for (const i of state.items) {
      if (state.hidden[i.vinted_id]) continue;
      counts.all++; counts[i.category] = (counts[i.category] || 0) + 1;
    }
    const tabs = $("tabs"); tabs.textContent = "";
    for (const [key, label] of CATS) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "tab"; b.id = "tab-" + key;
      b.setAttribute("aria-pressed", String(state.cat === key));
      b.textContent = label;
      const n = document.createElement("span"); n.className = "n"; n.textContent = counts[key] || 0; b.append(n);
      b.onclick = () => { state.cat = key; try { localStorage.setItem("radar.cat", key); } catch (e) {} render(); };
      tabs.append(b);
    }
  }

  function card(it) {
    const el = document.createElement("article"); el.className = "card";
    const pic = document.createElement("div"); pic.className = "pic";
    if (it.thumb && /^data:image\//.test(it.thumb)) {
      const img = document.createElement("img"); img.src = it.thumb; img.alt = it.title || ""; img.loading = "lazy"; pic.append(img);
    } else {
      const n = document.createElement("div"); n.className = "noimg"; n.textContent = "Photo sur Vinted"; pic.append(n);
    }
    if (isNew(it) && state.cat !== "saved") { const b = document.createElement("span"); b.className = "badge-new"; b.textContent = "Nouveau"; pic.append(b); }
    if (it.score != null) { const sc = document.createElement("span"); sc.className = "score"; sc.textContent = Number(it.score).toFixed(1); sc.title = (it.tags || []).join(" · "); pic.append(sc); }
    el.append(pic);

    const body = document.createElement("div"); body.className = "body";
    const brand = document.createElement("div"); brand.className = "brand"; brand.textContent = it.brand || "Sans marque";
    const title = document.createElement("div"); title.className = "title"; title.textContent = it.title || "";
    const meta = document.createElement("div"); meta.className = "meta";
    const sz = document.createElement("span"); sz.className = "size"; sz.textContent = it.size || "?";
    const cond = document.createElement("span"); cond.textContent = [it.condition, ago(it.listed_at || it.found_at)].filter(Boolean).join(" · ");
    meta.append(sz, cond);
    const price = document.createElement("div"); price.className = "price"; price.textContent = fmtPrice(it.price);
    if (it.total_price && it.total_price !== it.price) { const sm = document.createElement("small"); sm.textContent = fmtPrice(it.total_price) + " avec protection"; price.append(sm); }
    body.append(brand, title, meta, price);
    if (it.avis) { const a = document.createElement("div"); a.className = "avis"; a.textContent = it.avis; body.append(a); }

    const act = document.createElement("div"); act.className = "actions";
    const link = document.createElement("a"); link.className = "btn primary"; link.textContent = "Voir sur Vinted";
    link.href = /^https:\/\/www\.vinted\.fr\//.test(it.url || "") ? it.url : "https://www.vinted.fr/items/" + encodeURIComponent(it.vinted_id);
    link.target = "_blank"; link.rel = "noopener";
    const save = document.createElement("button"); save.type = "button"; save.className = "btn icon";
    save.innerHTML = ICON_STAR; save.setAttribute("aria-pressed", String(!!state.saved[it.vinted_id]));
    save.setAttribute("aria-label", state.saved[it.vinted_id] ? "Retirer des sauvegardes" : "Sauvegarder");
    save.onclick = () => toggleSave(it);
    act.append(link, save);
    if (state.cat !== "saved") {
      const hide = document.createElement("button"); hide.type = "button"; hide.className = "btn icon";
      hide.innerHTML = ICON_HIDE; hide.setAttribute("aria-label", "Masquer cette pièce");
      hide.onclick = () => toggleHide(it);
      act.append(hide);
    }
    body.append(act);
    el.append(body);
    return el;
  }

  function render() {
    renderTabs();
    $("sort").value = state.sort;
    const grid = $("grid"); grid.textContent = "";
    const list = visible();
    if (!list.length) {
      const e = document.createElement("div"); e.className = "empty"; e.style.gridColumn = "1 / -1";
      const t = document.createElement("strong");
      const p = document.createElement("span");
      if (!state.loaded) { t.textContent = "Chargement"; p.textContent = "Récupération des dernières trouvailles…"; }
      else if (state.cat === "saved") { t.textContent = "Rien de sauvegardé"; p.textContent = "Touche l'étoile d'une pièce pour la garder ici, même après son retrait du radar."; }
      else if (!state.items.length) { t.textContent = "Radar en attente"; p.textContent = "Aucune pièce pour l'instant. Le scan horaire déposera ici les annonces Vinted en L, W32–34 et 43–44 qui valent le coup d'œil."; }
      else { t.textContent = "Rien dans cette catégorie"; p.textContent = "Essaie un autre onglet, le prochain scan en ajoutera peut-être."; }
      e.append(t, p); grid.append(e); return;
    }
    const frag = document.createDocumentFragment();
    for (const it of list) frag.append(card(it));
    grid.append(frag);
  }

  function renderStatus() {
    const st = state.status;
    const dot = $("dot"), txt = $("statusText"), banner = $("banner");
    if (!st) { dot.className = "dot"; txt.textContent = state.loaded ? "Aucun scan pour l'instant" : "Connexion à la base…"; banner.hidden = true; return; }
    dot.className = "dot " + (st.ok ? "ok" : "err");
    const parts = ["Dernier scan " + ago(st.last_run)];
    if (st.ok) parts.push((st.added ?? st.matched ?? 0) + " ajout(s) sur " + (st.scanned || 0) + " annonces");
    txt.textContent = parts.join(" · ");
    if (st.error) { banner.hidden = false; banner.textContent = st.error; } else banner.hidden = true;
  }

  // ---- per-viewer prefs (private subtree) ----
  let writing = Promise.resolve();
  function savePrefs() {
    if (!state.db || !state.uid) return;
    const body = { hidden: state.hidden, lastSeen: state.lastSeen };
    writing = writing.then(() => state.db.doc("data/users/" + state.uid + "/prefs").set(body)).catch(() => {});
  }
  function toggleHide(it) {
    state.hidden[it.vinted_id] = true;
    savePrefs(); render();
  }
  function toggleSave(it) {
    const id = it.vinted_id;
    const was = !!state.saved[id];
    if (was) delete state.saved[id];
    else { const copy = Object.assign({}, it); state.saved[id] = copy; }
    render();
    if (!state.db || !state.uid) return;
    const ref = state.db.doc("data/users/" + state.uid + "/saved-" + id);
    writing = writing.then(() => was ? ref.delete() : ref.set(Object.assign({}, it))).catch(() => {});
  }

  $("sort").onchange = (e) => { state.sort = e.target.value; try { localStorage.setItem("radar.sort", state.sort); } catch (er) {} render(); };
  $("markSeen").onclick = () => {
    const newest = state.items.reduce((m, i) => (i.found_at > m ? i.found_at : m), "");
    state.lastSeen = newest || new Date().toISOString();
    try { localStorage.setItem("radar.lastSeen", state.lastSeen); } catch (e) {}
    savePrefs(); render();
  };

  render(); renderStatus();

  async function start() {
    if (!window.claude || !window.claude.use) { state.loaded = true; render(); renderStatus(); return; }
    const db = await window.claude.use("db");
    if (!db) {
      state.loaded = true;
      $("banner").hidden = false; $("banner").textContent = "La base de l'artifact n'est pas accessible dans cette vue. Ouvre la page connecté à ton compte Claude.";
      render(); renderStatus(); return;
    }
    state.db = db;
    const timer = setTimeout(() => { if (!state.loaded) { $("statusText").textContent = "La base ne répond pas encore, les données peuvent être en retard"; } }, 10000);
    db.collection("items").orderBy("found_at", "desc").limit(300).onSnapshot((snap) => {
      state.items = snap.docs.map((d) => Object.assign({ vinted_id: d.id }, d.data()));
      if (!snap.metadata.fromCache) { state.loaded = true; clearTimeout(timer); }
      render();
    }, (err) => { state.loaded = true; clearTimeout(timer); $("banner").hidden = false; $("banner").textContent = "Lecture des pièces impossible (" + err.code + ")."; render(); });
    db.doc("meta/status").onSnapshot((d) => { state.status = d.exists ? d.data() : null; renderStatus(); }, () => {});
    setInterval(renderStatus, 60000);

    const user = await window.claude.use("user");
    const uid = user ? await user.id() : null;
    if (!uid) return;
    state.uid = uid;
    db.collection("data/users/" + uid).onSnapshot((snap) => {
      const saved = {};
      for (const d of snap.docs) {
        const v = d.data();
        if (d.id === "prefs") {
          state.hidden = Object.assign({}, v.hidden || {});
          if (v.lastSeen && (!state.lastSeen || v.lastSeen > state.lastSeen)) state.lastSeen = v.lastSeen;
        } else if (d.id.startsWith("saved-")) saved[d.id.slice(6)] = Object.assign({ vinted_id: d.id.slice(6) }, v);
      }
      state.saved = saved;
      render();
    }, () => {});
  }
  start();
})();
</script>
